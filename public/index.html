<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaOS</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="boot-screen">
    <button id="boot-skip">Skip Boot ⏭</button>
    <div id="boot-terminal">
      <div class="boot-bar"><span class="tl-btn tl-close"></span><span class="tl-btn tl-min"></span><span class="tl-btn tl-max"></span><span style="margin-left:8px;color:#94a3b8;font-size:12px;">novaos-kernel — zsh</span></div>
      <pre id="boot-log"></pre>
    </div>
    <div id="boot-tux" title="NovaOS Kernel">🐧</div>
  </div>

  <video id="video-bg" autoplay loop muted playsinline></video>
  <canvas id="matrix-bg"></canvas>

  <header id="menubar">
    <div class="menu-left">
      <span class="apple-logo" id="apple-btn"></span>
      <strong id="active-app-name">Finder</strong>
      <span class="menu-item" id="menu-browser">Retina</span>
      <span class="menu-item" id="menu-arcade">Games</span>
      <span class="menu-item" id="menu-studio">Code</span>
      <span class="menu-item" id="menu-settings">Settings</span>
    </div>
    <div class="menu-right">
      <span id="clock"></span>
    </div>
  </header>

  <div id="apple-menu">
    <div class="drop-item" id="drop-settings">System Settings...</div>
    <div class="drop-item" id="drop-studio">Code Studio</div>
    <div class="drop-item" id="drop-arcade">App Store & Games</div>
    <div class="drop-sep"></div>
    <div class="drop-item" id="drop-restart">Restart NovaOS</div>
  </div>

  <main id="desktop"></main>

  <footer id="dock-wrap">
    <div id="dock"></div>
  </footer>

  <script src="/baremux/index.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv.config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
